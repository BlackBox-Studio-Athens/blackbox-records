name: UAT static smoke
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Deployed UAT static site URL.
        required: true
        default: https://blackbox-records-web-uat.pages.dev
        type: string
      scenario:
        description: Smoke scenario to run.
        required: true
        default: all
        type: choice
        options:
          - all
          - public_assets
          - checkout_shell
          - public_routes
      screenshots:
        description: Screenshot policy.
        required: true
        default: on-failure
        type: choice
        options:
          - on-failure
          - always
          - never
permissions:
  contents: read
concurrency:
  group: uat-static-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UAT_STATIC_SCREENSHOTS: ${{ inputs.screenshots }}
      UAT_STATIC_SITE_URL: ${{ inputs.site_url }}
      UAT_STATIC_SMOKE_SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run UAT static smoke
        run: >-
          pnpm smoke:uat-static --
          --site-url "${UAT_STATIC_SITE_URL}"
          --scenario "${UAT_STATIC_SMOKE_SCENARIO}"
          --screenshots "${UAT_STATIC_SCREENSHOTS}"
      - name: Upload UAT static smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uat-static-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/smoke/uat/uat-static/**
          if-no-files-found: warn
          retention-days: 7
