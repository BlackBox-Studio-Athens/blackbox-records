name: Full validation
# Backstop for narrowly declared Nx task inputs: the complete suite without cache reuse.
on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 0'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run uncached full validation
        run: pnpm validate:full --no-cache
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: full-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/validation
          if-no-files-found: ignore
          retention-days: 7
