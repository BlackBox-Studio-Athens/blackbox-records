name: Deploy and accept UAT
on:
  workflow_call:
    inputs:
      artifact_commit_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  UAT_PUBLIC_BACKEND_BASE_URL: ${{ vars.UAT_PUBLIC_BACKEND_BASE_URL }}
  PRD_PUBLIC_BACKEND_BASE_URL: ${{ vars.PRD_PUBLIC_BACKEND_BASE_URL }}
  SOURCE_SHA: ${{ inputs.artifact_commit_sha || github.sha }}
  RELEASE_TOOLS_DIR: ${{ (inputs.artifact_commit_sha || github.sha) == github.sha && '.' || '.codex-artifacts/release-tools' }}
jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    environment: catalog-promotion-uat
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${{ vars.STRIPE_PAYMENT_METHOD_CONFIGURATION_ID }}
    steps:
      - &require-uat-secrets
        name: Require UAT environment credentials before mutation
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN STRIPE_SECRET_KEY STRIPE_PAYMENT_METHOD_CONFIGURATION_ID; do
            [[ -n "${!name}" ]] || { echo "Missing UAT environment credential: $name" >&2; exit 1; }
          done
      - &checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.artifact_commit_sha || github.sha }}
      - &pnpm
        name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - &node
        name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - &install
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - &release-tools
        name: Checkout trusted release tooling
        if: ${{ inputs.artifact_commit_sha && inputs.artifact_commit_sha != github.sha }}
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .codex-artifacts/release-tools
          sparse-checkout: |
            scripts/
            apps/backend/cms-resources.json
          sparse-checkout-cone-mode: false
      - &download-candidate
        name: Download verified UAT target bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-uat-${{ inputs.artifact_commit_sha || github.sha }}
          path: .codex-artifacts/release
      - name: Verify UAT mutation preconditions
        run: node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify-backend uat
      - name: Prepare UAT catalog schema
        run: |
          pnpm runtime:config:verify --env uat
          pnpm stripe:webhooks:verify --env uat
          pnpm stripe:payment-methods:verify
          node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify-backend uat
          pnpm --filter @blackbox/backend d1:migrations:apply:uat
      - name: Prepare UAT CMS application schema
        run: |
          node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify-backend uat
          pnpm --filter @blackbox/backend cms:application-migrations --env uat --apply
      - name: Apply UAT EmDash core migrations
        run: |
          node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify-backend uat
          set -euo pipefail
          config='../../.codex-artifacts/release/uat/worker/server/wrangler.json'
          report="$RUNNER_TEMP/uat-cms-migrations.json"
          set +e
          node apps/backend/scripts/migrate-cms.mjs --env uat --wrangler-config "$config" --manifest "${config%/server/wrangler.json}/migrations.json" > "$report"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" -eq 2 ]]; then
            fingerprint=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);process.stdout.write(r.target.fingerprint)})' < "$report")
            [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            node apps/backend/scripts/migrate-cms.mjs --env uat --wrangler-config "$config" --manifest "${config%/server/wrangler.json}/migrations.json" --apply --fingerprint "$fingerprint"
          else
            cat "$report"
            exit "$status"
          fi
      - name: Prepare UAT CMS catalog fields
        run: |
          node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify-backend uat
          pnpm --filter @blackbox/backend cms:catalog-schema --env uat
      - name: Deploy UAT Worker
        run: |
          node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify-backend uat
          pnpm --filter @blackbox/backend exec wrangler deploy --config ../../.codex-artifacts/release/uat/renderer/server/wrangler.json
          pnpm --filter @blackbox/backend exec wrangler deploy --config ../../.codex-artifacts/release/uat/worker/server/wrangler.json --keep-vars
          node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify-worker uat
          pnpm store:listing-readiness:verify -- --env uat --url "$UAT_PUBLIC_BACKEND_BASE_URL/api/store/listing-prices"
      - name: Record actual deployed revisions
        if: ${{ always() }}
        run: node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" observe uat >> "$GITHUB_STEP_SUMMARY"
  deploy-uat-static:
    needs: deploy-uat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - *release-tools
      - *download-candidate
      - name: Deploy UAT to Cloudflare Pages
        run: |
          node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify uat
          node "$RELEASE_TOOLS_DIR/scripts/configure-public-gateway.mjs" uat
          pnpm --filter @blackbox/backend exec wrangler pages deploy ../../.codex-artifacts/release/uat/public --project-name=blackbox-records-web-uat --branch=main --commit-hash="$SOURCE_SHA"
          node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify-hosted uat
      - name: Install Chromium for UAT quick checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Run UAT quick checks
        run: |
          pnpm smoke:uat-static -- --site-url https://blackbox-records-web-uat.pages.dev --scenario all --screenshots on-failure
          echo "UAT quick checks passed for $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload UAT quick-check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uat-quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/smoke/uat/uat-static
          if-no-files-found: ignore
          retention-days: 7
      - name: Record actual deployed revisions
        if: ${{ always() }}
        run: node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" observe uat >> "$GITHUB_STEP_SUMMARY"
  smoke-uat:
    needs: deploy-uat-static
    runs-on: ubuntu-latest
    environment: catalog-promotion-uat
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${{ vars.STRIPE_PAYMENT_METHOD_CONFIGURATION_ID }}
    steps:
      - *require-uat-secrets
      - *checkout
      - *pnpm
      - *node
      - *install
      - *release-tools
      - *download-candidate
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run UAT provider smoke
        run: |
          pnpm smoke:stripe-uat -- --site-url https://blackbox-records-web-uat.pages.dev --worker-url "$UAT_PUBLIC_BACKEND_BASE_URL" --scenario happy_path_paid,pay_what_you_want_paid --screenshots on-failure
          pnpm smoke:resend-uat -- --worker-url "$UAT_PUBLIC_BACKEND_BASE_URL"
      - name: Verify current UAT release identity
        run: node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" verify-hosted uat
      - name: Record actual deployed revisions
        if: ${{ always() }}
        run: node "$RELEASE_TOOLS_DIR/scripts/release-candidate.mjs" observe uat >> "$GITHUB_STEP_SUMMARY"
      - name: Upload UAT acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uat-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/smoke/uat
          retention-days: 7
