name: Launch switch
run-name: Launch ${{ github.event_name == 'schedule' && 'finalize' || inputs.stage }} (${{ github.event_name == 'schedule' && 'live' || inputs.dry_run && 'dry-run' || 'live' }})
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Launch stage
        type: choice
        options: [cutover, rollback, finalize]
        default: cutover
        required: true
      dry_run:
        description: Check and plan only (uncheck to apply)
        type: boolean
        default: true
        required: true
      accept_release:
        description: Reviewed current PRD SHA (finalize only; defaults to LAUNCH_ACCEPT_RELEASE)
        type: string
        required: false
  schedule:
    - cron: '45 10 17 10 *'
permissions:
  contents: read
  actions: read
concurrency:
  group: launch-switch
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      execute: ${{ steps.request.outputs.execute }}
      stage: ${{ steps.request.outputs.stage }}
      dry_run: ${{ steps.request.outputs.dry_run }}
    steps:
      - name: Resolve launch request
        id: request
        env:
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { appendFileSync } = require('node:fs');
          const env = process.env;
          assert.equal(env.GITHUB_REF, 'refs/heads/main', 'Launch requires main.');
          const scheduled = env.GITHUB_EVENT_NAME === 'schedule';
          if (scheduled && new Date().toISOString().slice(0, 10) !== '2026-10-17') {
            appendFileSync(env.GITHUB_STEP_SUMMARY, 'Scheduled launch skipped: only 2026-10-17 UTC is authorized.\n');
          } else {
            const stage = scheduled ? 'finalize' : env.INPUT_STAGE;
            const dryRun = scheduled ? 'false' : env.INPUT_DRY_RUN;
            assert.ok(['cutover', 'rollback', 'finalize'].includes(stage), 'Invalid launch stage.');
            assert.ok(['true', 'false'].includes(dryRun), 'Invalid dry-run choice.');
            appendFileSync(env.GITHUB_OUTPUT, `execute=true\nstage=${stage}\ndry_run=${dryRun}\n`);
          }
          NODE
  launch:
    needs: request
    if: needs.request.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    environment: prd-launch
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        uses: ./.github/actions/playwright-browsers
        timeout-minutes: 5
        with:
          browsers: chromium
      - name: Write Stripe Dashboard review
        env:
          STRIPE_DASHBOARD_REVIEW: ${{ vars.STRIPE_DASHBOARD_REVIEW }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { mkdirSync, writeFileSync } = require('node:fs');
          const review = JSON.parse(process.env.STRIPE_DASHBOARD_REVIEW);
          mkdirSync('.codex-artifacts/launch', { recursive: true });
          writeFileSync('.codex-artifacts/launch/stripe-dashboard-review.json', JSON.stringify(review));
          NODE
      - name: Restore cutover snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.request.outputs.stage }}
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { copyFileSync, existsSync, rmSync } = require('node:fs');
          const path = require('node:path');
          const gh = (...args) => execFileSync('gh', [...args, '--repo', process.env.GITHUB_REPOSITORY], { encoding: 'utf8' });
          // shortcut: searches 100 recent runs; paginate if launch operations exceed that window.
          const runs = JSON.parse(gh('run', 'list', '--workflow', 'launch-switch.yml', '--branch', 'main', '--limit', '100', '--json', 'databaseId,displayTitle'));
          // Failed or refused live cutovers may retain the original snapshot; ignore dry-runs.
          const cutovers = runs.filter((run) => run.displayTitle === 'Launch cutover (live)');
          const directory = path.join(process.env.RUNNER_TEMP, 'launch-cutover-state');
          let restored = false;
          for (const cutover of cutovers) {
            if (existsSync(directory)) rmSync(directory, { recursive: true });
            try {
              gh('run', 'download', String(cutover.databaseId), '--name', 'launch-state', '--dir', directory);
            } catch (error) {
              if (!/no valid artifacts found to download|no artifact matches any of the names or patterns provided/.test(String(error.stderr))) throw error;
              continue;
            }
            const snapshot = path.join(directory, 'snapshot.json');
            if (!existsSync(snapshot)) continue;
            copyFileSync(snapshot, '.codex-artifacts/launch/snapshot.json');
            restored = true;
            break;
          }
          assert.ok(restored || process.env.STAGE === 'cutover', cutovers.length
            ? 'Missing snapshot in recent real cutover artifacts; rollback/finalize requires snapshot.json.'
            : 'No real cutover run found; rollback/finalize requires its launch-state artifact.');
          NODE
      - name: Run launch stage
        env:
          STAGE: ${{ needs.request.outputs.stage }}
          DRY_RUN: ${{ needs.request.outputs.dry_run }}
          ACCEPT_RELEASE: ${{ inputs.accept_release || vars.LAUNCH_ACCEPT_RELEASE }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          STRIPE_LAUNCH_KEY: ${{ secrets.STRIPE_LAUNCH_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=("$STAGE")
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          if [[ "$SCHEDULED" == true && ! "$ACCEPT_RELEASE" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Scheduled finalize requires a reviewed LAUNCH_ACCEPT_RELEASE SHA.' >&2
            exit 1
          fi
          if [[ "$STAGE" == finalize && -n "$ACCEPT_RELEASE" ]]; then args+=(--accept-release "$ACCEPT_RELEASE"); fi
          pnpm launch:switch -- "${args[@]}" 2>&1 | tee .codex-artifacts/launch/command.log
      - name: Write launch summary
        if: always()
        env:
          LAUNCH_JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync, existsSync, mkdirSync, readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const path = require('node:path');
          const directory = '.codex-artifacts/launch';
          mkdirSync(directory, { recursive: true });
          const files = readdirSync(directory, { recursive: true }).filter((file) => file.endsWith('summary.json'));
          const cell = (value = '') => String(value).replaceAll('|', '\\|').replaceAll('\n', ' ');
          let text = '';
          for (const file of files) {
            const summary = JSON.parse(readFileSync(path.join(directory, file), 'utf8'));
            text += `## Launch ${summary.stage}\n\nStatus: **${summary.status}**\n\n| Step | Status | Error |\n| --- | --- | --- |\n`;
            if (summary.acceptedRelease) text += `| Accepted PRD release | ${cell(summary.acceptedRelease)} | |\n`;
            for (const step of summary.steps) text += `| ${cell(step.name)} | ${cell(step.status)} | ${cell(step.error)} |\n`;
            if (summary.error) text += `\nError: ${cell(summary.error)}\n`;
          }
          if (!files.length) text = `## Launch\n\nStatus: **${process.env.LAUNCH_JOB_STATUS}**\n\nNo launch summary was produced; inspect the failed setup step above.\n`;
          const log = path.join(directory, 'command.log');
          const links = existsSync(log) ? [...new Set(readFileSync(log, 'utf8').match(/^https:\/\/\S+$/gm) ?? [])] : [];
          if (links.length) text += '\n### Manual follow-up\n\n' + links.map((link) => `- <${link}>\n`).join('');
          text += '\nDownload **launch-state** from this run’s Artifacts for the summaries and any recovery snapshot.\n';
          writeFileSync(path.join(directory, 'summary.md'), text);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
          NODE
      - name: Preserve launch state
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: launch-state
          path: .codex-artifacts/launch/**
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
