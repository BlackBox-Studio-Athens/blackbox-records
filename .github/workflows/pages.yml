name: Release BlackBox
on:
  push:
    branches: [main]
    paths-ignore: [docs/**, openspec/**, '*.md', LICENSE]
  workflow_dispatch:
    inputs:
      artifact_commit_sha:
        description: Full source SHA. Required for PRD promotion; UAT defaults to the triggering SHA.
        type: string
      candidate_run_id:
        description: Successful UAT candidate run ID for PRD promotion.
        type: string
      target:
        description: UAT candidate or PRD catalog plan; PRD mutations require their separate confirmation inputs.
        type: choice
        default: uat
        options: [uat, prd]
      confirm_code_promotion:
        description: Promote this reviewed candidate to disabled PRD; no catalog or launch authorization.
        type: boolean
        default: false
      confirm_live_catalog_changes:
        description: Separate one-run live catalog authorization; never enables checkout.
        type: boolean
        default: false
      confirm_cms_cutover:
        description: One-run approval to deploy the reviewed combined PRD CMS artifact and staff route; no catalog or shopper launch authorization.
        type: boolean
        default: false
      catalog_plan_sha256:
        description: Reviewed initial-price or CMS catalog backfill plan SHA-256.
        type: string
      cms_import_report:
        description: PRD import read-only verification JSON; selects catalog linkage backfill instead of initial Price preparation.
        type: string
permissions:
  contents: read
concurrency:
  # ponytail: one release lock; split by target if parallel releases become necessary.
  group: blackbox-release
  cancel-in-progress: false
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  UAT_PUBLIC_BACKEND_BASE_URL: ${{ vars.UAT_PUBLIC_BACKEND_BASE_URL }}
  PRD_PUBLIC_BACKEND_BASE_URL: ${{ vars.PRD_PUBLIC_BACKEND_BASE_URL }}
  SOURCE_SHA: ${{ inputs.artifact_commit_sha || github.sha }}
jobs:
  build-candidate:
    if: ${{ github.event_name == 'push' || inputs.target == 'uat' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require immutable main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main" --jq '.status' | grep -Eq '^(ahead|identical)$'
      - &checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.artifact_commit_sha || github.sha }}
      - &pnpm
        name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 12.0.0
      - &node
        name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - &install
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start Astro image cache restore timer
        id: astro-cache-restore-start
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Restore Astro image cache
        id: astro-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: apps/web/node_modules/.astro/assets
          key: astro-assets-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'apps/web/package.json', 'apps/web/astro.config.mjs') }}-${{ inputs.artifact_commit_sha || github.sha }}-${{ github.run_id }}
          restore-keys: |
            astro-assets-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'apps/web/package.json', 'apps/web/astro.config.mjs') }}-
      - name: Record Astro image cache restore
        if: ${{ always() }}
        run: |
          set -euo pipefail
          end_ms=$(date +%s%3N)
          bytes=$(du -sb apps/web/node_modules/.astro/assets 2>/dev/null | cut -f1 || true)
          bytes=${bytes:-0}
          elapsed_ms=$((end_ms - ${{ steps.astro-cache-restore-start.outputs.started_ms }}))
          echo "Astro image cache restore: hit=${{ steps.astro-cache.outputs.cache-hit }} bytes=${bytes} elapsed_ms=${elapsed_ms}" >> "$GITHUB_STEP_SUMMARY"
      - &release-tools
        name: Checkout trusted release tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .codex-artifacts/release-tools
          sparse-checkout: |
            scripts/
            apps/backend/cms-resources.json
          sparse-checkout-cone-mode: false
      - name: Run validation checks
        run: pnpm validate:checks
      - name: Run unused code audit
        run: pnpm audit:unused
      - name: Restore current UAT publication
        id: uat-content
        env:
          CMS_PUBLICATION_EXPORT_TOKEN: ${{ secrets.UAT_CMS_PUBLICATION_EXPORT_TOKEN }}
          CMS_EXPORT_ACCESS_CLIENT_ID: ${{ secrets.UAT_CMS_EXPORT_ACCESS_CLIENT_ID }}
          CMS_EXPORT_ACCESS_CLIENT_SECRET: ${{ secrets.UAT_CMS_EXPORT_ACCESS_CLIENT_SECRET }}
          CMS_PUBLICATION_MAX_REQUESTS: ${{ vars.UAT_CMS_PUBLICATION_MAX_REQUESTS }}
        run: node --import tsx .codex-artifacts/release-tools/scripts/restore-published-content.mjs uat
      - name: Build hosted UAT static frontend
        env:
          CMS_CONTENT_SOURCE: ${{ steps.uat-content.outputs.source }}
          CMS_CONTENT_SNAPSHOT: ${{ github.workspace }}/.codex-artifacts/release-content/uat/snapshot.json
          CMS_CONTENT_SHA256: ${{ steps.uat-content.outputs.sha256 }}
          CMS_CONTENT_ENVIRONMENT: uat
          ASTRO_SITE_URL: https://blackbox-records-web-uat.pages.dev
          ASTRO_BASE_PATH: /
          PUBLIC_BACKEND_BASE_URL: ${{ vars.UAT_PUBLIC_BACKEND_BASE_URL }}
          SHOW_REVIEW_SITE_MARKER: 'true'
        run: pnpm build:web
      - name: Retain UAT artifact
        run: |
          mkdir -p .codex-artifacts/release/uat .codex-artifacts/release/prd
          cp -R apps/web/dist .codex-artifacts/release/uat/public
      - name: Restore current PRD publication
        id: prd-content
        env:
          CMS_PUBLICATION_EXPORT_TOKEN: ${{ secrets.PRD_CMS_PUBLICATION_EXPORT_TOKEN }}
          CMS_EXPORT_ACCESS_CLIENT_ID: ${{ secrets.PRD_CMS_EXPORT_ACCESS_CLIENT_ID }}
          CMS_EXPORT_ACCESS_CLIENT_SECRET: ${{ secrets.PRD_CMS_EXPORT_ACCESS_CLIENT_SECRET }}
          CMS_PUBLICATION_MAX_REQUESTS: ${{ vars.PRD_CMS_PUBLICATION_MAX_REQUESTS }}
        run: node --import tsx .codex-artifacts/release-tools/scripts/restore-published-content.mjs prd
      - name: Build hosted PRD static frontend
        env:
          CMS_CONTENT_SOURCE: ${{ steps.prd-content.outputs.source }}
          CMS_CONTENT_SNAPSHOT: ${{ github.workspace }}/.codex-artifacts/release-content/prd/snapshot.json
          CMS_CONTENT_SHA256: ${{ steps.prd-content.outputs.sha256 }}
          CMS_CONTENT_ENVIRONMENT: prd
          ASTRO_SITE_URL: https://blackbox-records-web.pages.dev
          ASTRO_BASE_PATH: /
          PUBLIC_BACKEND_BASE_URL: ${{ vars.PRD_PUBLIC_BACKEND_BASE_URL }}
        run: pnpm build
      - name: Retain PRD and Worker artifacts
        run: |
          cp -R apps/web/dist .codex-artifacts/release/prd/public
          pnpm --filter @blackbox/backend build:cms --env uat
          cp -R apps/backend/dist .codex-artifacts/release/uat/worker
          cp apps/backend/.emdash/migrations.json .codex-artifacts/release/uat/worker/migrations.json
          pnpm --filter @blackbox/backend build:cms --env prd --out-dir ../../.codex-artifacts/release/prd/cms
          cp apps/backend/.emdash/migrations.json .codex-artifacts/release/prd/cms/migrations.json
          node scripts/build-public-release.mjs uat
          node scripts/build-public-release.mjs prd
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs pack
      - name: Install preview test browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Verify staff previews in Chromium and Firefox
        env:
          STAFF_PREVIEW_ENVIRONMENT: prd
        run: node --import tsx scripts/run-release-preparation.mjs browsers
      - name: Measure Astro image cache candidate
        id: astro-cache-candidate
        if: ${{ success() }}
        run: |
          set -euo pipefail
          bytes=$(du -sb apps/web/node_modules/.astro/assets 2>/dev/null | cut -f1 || true)
          bytes=${bytes:-0}
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"
          if (( bytes <= 629145600 )); then
            echo "save=true" >> "$GITHUB_OUTPUT"
            echo "Astro image cache candidate: bytes=${bytes}, save=true" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "Astro image cache candidate: bytes=${bytes}, save=false (over 600 MiB)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Start Astro image cache save timer
        id: astro-cache-save-start
        if: ${{ steps.astro-cache-candidate.outputs.save == 'true' }}
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Save Astro image cache
        if: ${{ steps.astro-cache-candidate.outputs.save == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: apps/web/node_modules/.astro/assets
          key: astro-assets-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'apps/web/package.json', 'apps/web/astro.config.mjs') }}-${{ inputs.artifact_commit_sha || github.sha }}-${{ github.run_id }}
      - name: Record Astro image cache save
        if: ${{ always() && steps.astro-cache-candidate.outputs.save == 'true' }}
        run: |
          set -euo pipefail
          end_ms=$(date +%s%3N)
          elapsed_ms=$((end_ms - ${{ steps.astro-cache-save-start.outputs.started_ms }}))
          echo "Astro image cache save: bytes=${{ steps.astro-cache-candidate.outputs.bytes }} elapsed_ms=${elapsed_ms}" >> "$GITHUB_STEP_SUMMARY"
      - name: Start release bundle upload timer
        id: release-upload-start
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ inputs.artifact_commit_sha || github.sha }}
          path: .codex-artifacts/release
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Record release bundle upload
        if: ${{ always() }}
        run: |
          set -euo pipefail
          end_ms=$(date +%s%3N)
          elapsed_ms=$((end_ms - ${{ steps.release-upload-start.outputs.started_ms }}))
          echo "Release bundle upload elapsed_ms=${elapsed_ms}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/validation
          if-no-files-found: ignore
          retention-days: 7
  inspect-uat-pages:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - *checkout
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - *release-tools
      - &download-candidate
        name: Download verified release bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-${{ inputs.artifact_commit_sha || github.sha }}
          path: .codex-artifacts/release
      - name: Verify Pages credential and UAT preconditions
        run: node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify uat
  deploy-uat:
    needs: [build-candidate, inspect-uat-pages]
    runs-on: ubuntu-latest
    environment: catalog-promotion-uat
    timeout-minutes: 40
    env: &uat-credentials
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${{ vars.STRIPE_PAYMENT_METHOD_CONFIGURATION_ID }}
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - *release-tools
      - *download-candidate
      - name: Verify UAT mutation preconditions
        run: node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify-backend uat
      - name: Prepare UAT catalog schema
        run: |
          pnpm runtime:config:verify --env uat
          pnpm stripe:webhooks:verify --env uat
          pnpm stripe:payment-methods:verify
          pnpm --filter @blackbox/backend d1:migrations:apply:uat
      - name: Prepare UAT CMS application schema
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify-backend uat
          pnpm --filter @blackbox/backend cms:application-migrations --env uat --apply
      - name: Apply UAT EmDash core migrations
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify-backend uat
          set -euo pipefail
          config='../../.codex-artifacts/release/uat/worker/server/wrangler.json'
          report="$RUNNER_TEMP/uat-cms-migrations.json"
          set +e
          node apps/backend/scripts/migrate-cms.mjs --env uat --wrangler-config "$config" --manifest "${config%/server/wrangler.json}/migrations.json" > "$report"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" -eq 2 ]]; then
            fingerprint=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);process.stdout.write(r.target.fingerprint)})' < "$report")
            [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            node apps/backend/scripts/migrate-cms.mjs --env uat --wrangler-config "$config" --manifest "${config%/server/wrangler.json}/migrations.json" --apply --fingerprint "$fingerprint"
          else
            cat "$report"
            exit "$status"
          fi
      - name: Deploy UAT Worker
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify-backend uat
          pnpm --filter @blackbox/backend exec wrangler deploy --config ../../.codex-artifacts/release/uat/renderer/server/wrangler.json
          pnpm --filter @blackbox/backend exec wrangler deploy --config ../../.codex-artifacts/release/uat/worker/server/wrangler.json --keep-vars
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify-worker uat
          pnpm store:listing-readiness:verify -- --env uat --url "$UAT_PUBLIC_BACKEND_BASE_URL/api/store/listing-prices"
      - &observe-uat
        name: Record actual deployed revisions
        if: ${{ always() }}
        run: node .codex-artifacts/release-tools/scripts/release-candidate.mjs observe uat >> "$GITHUB_STEP_SUMMARY"
  deploy-uat-static:
    needs: deploy-uat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - *release-tools
      - *download-candidate
      - name: Deploy UAT to Cloudflare Pages
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify uat
          node .codex-artifacts/release-tools/scripts/configure-public-gateway.mjs uat
          pnpm --filter @blackbox/backend exec wrangler pages deploy ../../.codex-artifacts/release/uat/public --project-name=blackbox-records-web-uat --branch=main --commit-hash="$SOURCE_SHA"
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify-hosted uat
      - *observe-uat
  smoke-uat:
    needs: deploy-uat-static
    runs-on: ubuntu-latest
    environment: catalog-promotion-uat
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env: *uat-credentials
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - *release-tools
      - *download-candidate
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run UAT provider smoke
        run: |
          pnpm smoke:stripe-uat -- --site-url https://blackbox-records-web-uat.pages.dev --worker-url "$UAT_PUBLIC_BACKEND_BASE_URL" --scenario happy_path_paid,pay_what_you_want_paid --screenshots on-failure
          pnpm smoke:resend-uat -- --worker-url "$UAT_PUBLIC_BACKEND_BASE_URL"
          pnpm smoke:uat-static -- --site-url https://blackbox-records-web-uat.pages.dev --scenario all --screenshots on-failure
      - name: Verify current UAT release identity
        run: node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify-hosted uat
      - *observe-uat
      - name: Upload UAT acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uat-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/smoke/uat
          retention-days: 7
  deploy-prd:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'prd' && inputs.confirm_code_promotion }}
    runs-on: ubuntu-latest
    environment: catalog-promotion-prd
    permissions: &prd-permissions
      contents: read
      actions: read
    timeout-minutes: 25
    env: &prd-release-env
      SOURCE_SHA: ${{ inputs.artifact_commit_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CONFIRM_CODE_PROMOTION: ${{ inputs.confirm_code_promotion }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - &checkout-promotion
        name: Checkout trusted promotion tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - *pnpm
      - *node
      - *install
      - *release-tools
      - &download-selected-candidate
        name: Download selected candidate artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-${{ inputs.artifact_commit_sha }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: .codex-artifacts/release
      - name: Verify PRD mutation preconditions
        run: node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify prd
      - name: Apply compatible PRD migrations
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify prd
          pnpm --filter @blackbox/backend d1:migrations:apply:prd
      - name: Prepare PRD CMS application schema
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify prd
          pnpm --filter @blackbox/backend cms:application-migrations --env prd --apply --confirm-live-cms-changes
      - name: Apply reviewed PRD EmDash core migrations
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify prd
          set -euo pipefail
          config='../../.codex-artifacts/release/prd/cms/server/wrangler.json'
          report="$RUNNER_TEMP/prd-cms-migrations.json"
          set +e
          node apps/backend/scripts/migrate-cms.mjs --env prd --wrangler-config "$config" --manifest "${config%/server/wrangler.json}/migrations.json" > "$report"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" -eq 2 ]]; then
            fingerprint=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);process.stdout.write(r.target.fingerprint)})' < "$report")
            [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            node apps/backend/scripts/migrate-cms.mjs --env prd --wrangler-config "$config" --manifest "${config%/server/wrangler.json}/migrations.json" --apply --fingerprint "$fingerprint" --confirm-live-cms-changes
          else
            cat "$report"
            exit "$status"
          fi
      - name: Deploy candidate PRD public renderer
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify prd
          pnpm --filter @blackbox/backend exec wrangler deploy --config ../../.codex-artifacts/release/prd/renderer/server/wrangler.json
      - name: Deploy candidate combined PRD CMS Worker
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify prd
          pnpm --filter @blackbox/backend exec wrangler versions upload --config ../../.codex-artifacts/release/prd/cms/server/wrangler.json --keep-vars --tag "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pnpm --filter @blackbox/backend exec wrangler versions deploy --config ../../.codex-artifacts/release/prd/cms/server/wrangler.json --version-tag "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT@100%" --yes
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify-worker prd
      - &observe-prd
        name: Record actual deployed revisions
        if: ${{ always() }}
        run: node .codex-artifacts/release-tools/scripts/release-candidate.mjs observe prd >> "$GITHUB_STEP_SUMMARY"
  deploy-prd-static:
    needs: deploy-prd
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'prd' && inputs.confirm_code_promotion }}
    runs-on: ubuntu-latest
    permissions: *prd-permissions
    timeout-minutes: 25
    env: *prd-release-env
    steps:
      - *checkout-promotion
      - *pnpm
      - *node
      - *install
      - *release-tools
      - *download-selected-candidate
      - name: Deploy PRD static frontend to Cloudflare Pages
        run: |
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify prd
          node .codex-artifacts/release-tools/scripts/configure-public-gateway.mjs prd
          pnpm --filter @blackbox/backend exec wrangler pages deploy ../../.codex-artifacts/release/prd/public --project-name=blackbox-records-web --branch=main --commit-hash="$SOURCE_SHA"
          node .codex-artifacts/release-tools/scripts/release-candidate.mjs verify-hosted prd
      - *observe-prd
  catalog-prd-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'prd' && !inputs.confirm_live_catalog_changes && !inputs.confirm_code_promotion && !inputs.confirm_cms_cutover }}
    runs-on: ubuntu-latest
    environment: catalog-promotion-prd
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: Plan PRD catalog without mutation
        if: ${{ !inputs.cms_import_report }}
        run: |
          set -euo pipefail
          pnpm exec tsx apps/backend/scripts/prepare-prd-initial-price.ts | tee "$GITHUB_STEP_SUMMARY"
      - &prepare-backfill
        name: Prepare verified PRD CMS linkage inputs
        if: ${{ inputs.cms_import_report != '' }}
        env:
          CMS_IMPORT_REPORT: ${{ inputs.cms_import_report }}
        run: |
          set -euo pipefail
          node --import tsx scripts/import-cms-content.mjs --preparePrd .codex-artifacts/emdash-m1/prd-import-preparation
          printf '%s' "$CMS_IMPORT_REPORT" > .codex-artifacts/emdash-m1/prd-import-verified.json
      - name: Plan PRD CMS catalog linkage without mutation
        if: ${{ inputs.cms_import_report != '' }}
        run: |
          set -euo pipefail
          pnpm exec tsx apps/backend/scripts/backfill-runtime-catalog.ts --env prd --cms-plan .codex-artifacts/emdash-m1/prd-import-preparation/plan.json --cms-report .codex-artifacts/emdash-m1/prd-import-verified.json | tee "$GITHUB_STEP_SUMMARY"
  catalog-prd:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'prd' && inputs.confirm_live_catalog_changes && !inputs.confirm_code_promotion }}
    runs-on: ubuntu-latest
    environment: catalog-promotion-prd
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${{ vars.STRIPE_PAYMENT_METHOD_CONFIGURATION_ID }}
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - *release-tools
      - name: Verify catalog source
        if: ${{ !inputs.cms_import_report }}
        run: pnpm test:unit && pnpm check && pnpm build
      - name: Prepare explicitly authorized PRD catalog
        if: ${{ !inputs.confirm_cms_cutover && !inputs.cms_import_report }}
        run: |
          pnpm runtime:config:verify --env prd --require-live-secrets
          pnpm stripe:webhooks:verify --env prd
          pnpm stripe:payment-methods:verify
          pnpm --filter @blackbox/backend d1:migrations:apply:prd
          pnpm --filter @blackbox/backend d1:seed:prd:catalog-readiness
          pnpm stripe:catalog:verify --env prd --apply --confirm-live-catalog-changes --ci-promotion --artifact-commit-sha "$SOURCE_SHA" --promotion-run-id "$GITHUB_RUN_ID"
      - name: Prepare reviewed CMS cutover initial Price
        if: ${{ inputs.confirm_cms_cutover && !inputs.cms_import_report }}
        env:
          REVIEWED_CATALOG_PLAN_SHA256: ${{ inputs.catalog_plan_sha256 }}
        run: pnpm exec tsx apps/backend/scripts/prepare-prd-initial-price.ts --apply --confirm-live-catalog-changes --plan-sha256 "$REVIEWED_CATALOG_PLAN_SHA256"
      - *prepare-backfill
      - name: Apply reviewed PRD CMS catalog linkage
        if: ${{ inputs.cms_import_report != '' }}
        env:
          REVIEWED_CATALOG_PLAN_SHA256: ${{ inputs.catalog_plan_sha256 }}
        run: |
          set -euo pipefail
          pnpm exec tsx apps/backend/scripts/backfill-runtime-catalog.ts --env prd --cms-plan .codex-artifacts/emdash-m1/prd-import-preparation/plan.json --cms-report .codex-artifacts/emdash-m1/prd-import-verified.json --apply --confirm-live-catalog-changes --plan-sha256 "$REVIEWED_CATALOG_PLAN_SHA256" | tee "$GITHUB_STEP_SUMMARY"
      - name: Configure approved PRD member price commands
        if: ${{ inputs.cms_import_report != '' && inputs.confirm_cms_cutover }}
        run: |
          set -euo pipefail
          printf '%s' "$STRIPE_SECRET_KEY" | pnpm --filter @blackbox/backend exec wrangler secret put STRIPE_SECRET_KEY --env prd
