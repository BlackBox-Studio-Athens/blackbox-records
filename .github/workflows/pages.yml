name: Release BlackBox
on:
  push:
    branches: [main]
    paths-ignore: [docs/**, openspec/**, '*.md', LICENSE]
permissions:
  contents: read
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  UAT_PUBLIC_BACKEND_BASE_URL: ${{ vars.UAT_PUBLIC_BACKEND_BASE_URL }}
  SOURCE_SHA: ${{ github.sha }}
jobs:
  # Pushing to main deploys UAT only: the build and the static checks gate the deploy. Both browser suites run beside
  # it on every push and gate PRD promotion, a separate manual run of promote-prd.yml.
  check-candidate:
    strategy:
      fail-fast: false
      matrix:
        part: [lint, typecheck, tests]
    concurrency:
      group: ci-${{ github.ref }}-checks-${{ matrix.part }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - &pnpm
        name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - &node
        name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - &install
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run validation checks
        # nx.json keeps 3 for laptops; public-repository runners have 4 vCPUs.
        env:
          NX_PARALLEL: 4
        run: pnpm validate:checks --part=${{ matrix.part }}
      - name: Upload validation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.part }}
          path: .codex-artifacts/validation
          if-no-files-found: ignore
          retention-days: 7
  # The whole end-to-end suite runs on every push against a Local production fixture, in four balanced Playwright
  # shards beside the deploy; a red shard fails the run, and promotion refuses a failed run.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: ci-${{ github.ref }}-e2e-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: Install public end-to-end browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Build Local production fixture for end-to-end tests
        run: pnpm build:web
      - name: Run the whole end-to-end suite
        env:
          BLACKBOX_E2E_PREVIEW: '1'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - name: Upload end-to-end evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: .codex-artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7
  # Builds the PRD staff app and checks the previews, one browser per leg, beside the deploy; offline, so it holds no
  # credential. Both legs install both browsers: the chromium leg's preview policy checks both engines.
  staff-previews:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    concurrency:
      group: ci-${{ github.ref }}-staff-previews-${{ matrix.browser }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: Install preview test browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Verify staff previews in ${{ matrix.browser }}
        env:
          PUBLIC_STAFF_ENVIRONMENT: prd
          STAFF_PREVIEW_ENVIRONMENT: prd
        run: pnpm validate:editor --browser=${{ matrix.browser }}
      - name: Upload staff preview evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: staff-previews-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}
          path: .codex-artifacts/validation
          if-no-files-found: ignore
          retention-days: 7
  # Content-free: the renderer reads its accepted snapshot at runtime, so the build holds no CMS credential or content.
  build-uat:
    concurrency:
      group: ci-${{ github.ref }}-build-uat
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: Build UAT CMS Worker and renderer
        run: |
          pnpm --filter @blackbox/backend build:cms --env uat --out-dir ../../.codex-artifacts/release/uat/cms
          cp apps/backend/.emdash/migrations.json .codex-artifacts/release/uat/cms/migrations.json
          node scripts/build-public-release.mjs uat
      # Only deploy-uat reads this, within the run. Three days let a failed run be rerun without rebuilding it.
      - name: Upload UAT release
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-uat
          path: .codex-artifacts/release/uat
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 3
  # One serialized mutation per push: a newer push replaces a waiting run and never cancels one that is deploying.
  deploy-uat:
    needs: [check-candidate, build-uat]
    concurrency:
      group: release-uat
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: catalog-promotion-uat
    timeout-minutes: 40
    env:
      STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${{ vars.STRIPE_PAYMENT_METHOD_CONFIGURATION_ID }}
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: Download UAT release
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-uat
          path: .codex-artifacts/release/uat
      # Read-only, and first, so a token with no Pages access fails before any migration.
      - name: Verify the Pages credential
        env: &cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/configure-public-gateway.mjs uat --check
      - name: Verify UAT mutation preconditions
        run: node scripts/release-candidate.mjs verify uat
      - name: Verify UAT runtime and Stripe configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          pnpm runtime:config:verify --env uat
          pnpm stripe:webhooks:verify --env uat
          pnpm stripe:payment-methods:verify
      - name: Apply UAT migrations
        env: *cloudflare
        run: |
          pnpm --filter @blackbox/backend d1:migrations:apply:uat
          pnpm --filter @blackbox/backend cms:application-migrations --env uat --apply
          node apps/backend/scripts/migrate-cms.mjs --env uat --wrangler-config ../../.codex-artifacts/release/uat/cms/server/wrangler.json --manifest ../../.codex-artifacts/release/uat/cms/migrations.json --apply
          pnpm --filter @blackbox/backend cms:catalog-schema --env uat
      - name: Deploy UAT Workers
        env: *cloudflare
        run: |
          pnpm --filter @blackbox/backend exec wrangler deploy --config ../../.codex-artifacts/release/uat/renderer/server/wrangler.json
          pnpm --filter @blackbox/backend exec wrangler deploy --config ../../.codex-artifacts/release/uat/cms/server/wrangler.json --keep-vars
      - name: Deploy UAT to Cloudflare Pages
        env: *cloudflare
        run: |
          node scripts/configure-public-gateway.mjs uat
          pnpm --filter @blackbox/backend exec wrangler pages deploy ../../.codex-artifacts/release/uat/public --project-name=blackbox-records-web-uat --branch=main --commit-hash="$SOURCE_SHA"
      # The identity checks are public reads; the token only lets the listing check read D1's published Store Items.
      - name: Verify the deployed UAT release
        env: *cloudflare
        run: |
          node scripts/release-candidate.mjs verify-worker uat
          pnpm store:listing-readiness:verify -- --env uat --url "$UAT_PUBLIC_BACKEND_BASE_URL/api/store/listing-prices"
          node scripts/release-candidate.mjs verify-hosted uat
      # Smokes the UAT this run just deployed. A red smoke fails the run, and promotion refuses a failed run.
      - name: Install Chromium for the smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Run UAT static smoke
        run: pnpm smoke:uat-static -- --site-url https://blackbox-records-web-uat.pages.dev --scenario all --screenshots on-failure
      - name: Require UAT to still serve this run
        run: node scripts/release-candidate.mjs verify-hosted uat
      - name: Upload UAT static smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uat-static-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/smoke/uat/uat-static
          if-no-files-found: ignore
          retention-days: 7
