name: UAT provider smoke
on:
  workflow_dispatch:
    inputs:
      expected_checkout_amount_minor:
        description: Optional replacement Price amount in minor units; runs the no-payment Checkout surface proof.
        required: false
        type: string
permissions:
  contents: read
concurrency:
  # Its own group: a queued manual smoke must not cancel a pending push deploy waiting in blackbox-release.
  group: uat-provider-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: catalog-promotion-uat
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${{ vars.STRIPE_PAYMENT_METHOD_CONFIGURATION_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      UAT_SITE_URL: https://blackbox-records-web-uat.pages.dev
      UAT_WORKER_URL: ${{ vars.UAT_PUBLIC_BACKEND_BASE_URL }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify UAT webhook and payment configuration
        run: |
          pnpm stripe:webhooks:verify --env uat
          pnpm stripe:payment-methods:verify
      - name: Run UAT provider smoke
        if: ${{ inputs.expected_checkout_amount_minor == '' }}
        run: |
          pnpm smoke:stripe-uat -- \
            --site-url "${UAT_SITE_URL}" \
            --worker-url "${UAT_WORKER_URL}" \
            --scenario happy_path_paid,pay_what_you_want_paid \
            --screenshots on-failure
          pnpm smoke:resend-uat -- \
            --worker-url "${UAT_WORKER_URL}"
      - name: Run replacement Price Checkout surface proof
        if: ${{ inputs.expected_checkout_amount_minor != '' }}
        env:
          EXPECTED_CHECKOUT_AMOUNT_MINOR: ${{ inputs.expected_checkout_amount_minor }}
        run: |
          pnpm smoke:stripe-uat -- \
            --site-url "${UAT_SITE_URL}" \
            --worker-url "${UAT_WORKER_URL}" \
            --scenario checkout_surface \
            --expected-checkout-amount-minor "${EXPECTED_CHECKOUT_AMOUNT_MINOR}" \
            --screenshots on-failure
      - name: Upload UAT provider smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uat-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .codex-artifacts/smoke/uat/stripe-sandbox/**
            .codex-artifacts/smoke/uat/resend-uat/**
          if-no-files-found: warn
          retention-days: 7
