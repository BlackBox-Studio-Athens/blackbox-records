name: Verify Playwright image
description: Check the Playwright image version and trust the checked-out workspace for Git.
runs:
  using: composite
  steps:
    - name: Check Playwright image version
      shell: bash
      run: |
        image_version="$(node -p "JSON.parse(require('fs').readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion")"
        package_version="$(pnpm exec playwright --version | awk '{print $2}')"
        if [[ -z "$image_version" || "$package_version" != "$image_version" ]]; then
          echo "::error::Playwright package version $package_version does not match image version $image_version. Update the package and image together."
          exit 1
        fi
    - name: Trust the Git workspace
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
