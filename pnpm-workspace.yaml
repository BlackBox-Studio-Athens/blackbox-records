packages:
  - apps/*
  - packages/*
overrides:
  # The pool's bundled runtime predates the Worker's 2026-08-31 compatibility date.
  '@cloudflare/vitest-pool-workers>miniflare': 5.20260925.0-alpha
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260926.1'
  - '@emdash-cms/admin@0.41.0'
  - '@emdash-cms/auth@0.41.0'
  - '@emdash-cms/blocks@0.41.0'
  - '@emdash-cms/cloudflare@0.41.0'
  - '@emdash-cms/gutenberg-to-portable-text@0.41.0'
  - '@types/node@24.19.0'
  - emdash@0.41.0
  - miniflare@5.20260925.0-alpha
  - resend@6.30.0
  - wrangler@4.141.0
patchedDependencies:
  emdash@0.41.0: patches/emdash@0.41.0.patch
