packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  msw: true
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260926.1'
  - '@emdash-cms/admin@1.3.1'
  - '@emdash-cms/auth@1.3.1'
  - '@emdash-cms/blocks@1.3.1'
  - '@emdash-cms/cloudflare@1.3.1'
  - '@emdash-cms/gutenberg-to-portable-text@1.3.1'
  - '@types/node@24.19.0'
  - emdash@1.3.1
  - miniflare@5.20260925.0-alpha || 5.20261019.2-beta
  - resend@6.30.0
  - wrangler@4.141.0 || 4.152.0
  - '@emdash-cms/plugin-types@0.5.0'
  - '@emdash-cms/registry-client@0.7.1'
  - '@emdash-cms/registry-lexicons@0.7.0'
  - '@emdash-cms/registry-verification@0.3.3'
  - '@cloudflare/vitest-plugin@1.4.7'
  - stripe@23.0.1
patchedDependencies:
  '@emdash-cms/admin@1.3.1': patches/@emdash-cms__admin@1.3.1.patch
  emdash@1.3.1: patches/emdash@1.3.1.patch
