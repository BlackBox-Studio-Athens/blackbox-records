packages:
  - apps/*
  - packages/*
overrides:
  # The pool's bundled runtime predates the Worker's 2026-08-31 compatibility date.
  '@cloudflare/vitest-pool-workers>miniflare': 5.20260925.0-alpha
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  msw: true
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260926.1'
  - '@emdash-cms/admin@1.1.0'
  - '@emdash-cms/auth@1.1.0'
  - '@emdash-cms/blocks@1.1.0'
  - '@emdash-cms/cloudflare@1.1.0'
  - '@emdash-cms/gutenberg-to-portable-text@1.1.0'
  - '@types/node@24.19.0'
  - emdash@1.1.0
  - miniflare@5.20260925.0-alpha
  - resend@6.30.0
  - wrangler@4.141.0
  - '@emdash-cms/plugin-types@0.5.0'
  - '@emdash-cms/registry-client@0.7.0'
  - '@emdash-cms/registry-lexicons@0.7.0'
  - '@emdash-cms/registry-verification@0.3.3'
patchedDependencies:
  '@emdash-cms/admin@1.1.0': patches/@emdash-cms__admin@1.1.0.patch
  emdash@1.1.0: patches/emdash@1.1.0.patch
