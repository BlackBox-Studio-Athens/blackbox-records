[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-artwork-fetcher"
version = "0.1.0"
description = "Local release artwork fetcher for reusable CSV/TSV music lists."
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "bandcamp_async_api>=0.2.6",
  "musicbrainzngs>=0.7.1",
  "Pillow>=12.3.0",
  "requests>=2.34.2",
  "yt-dlp>=2026.8.19",
]

[project.scripts]
artwork-fetcher = "artwork_fetcher.cli:main"
vinyl-mockup = "artwork_fetcher.mockup:main"
cd-front-mockup = "artwork_fetcher.cd_mockup:main"
cassette-front-mockup = "artwork_fetcher.cassette_mockup:main"
distro-sync = "artwork_fetcher.distro_sync:main"
release-date-research = "artwork_fetcher.release_date_research:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artwork_fetcher = ["assets/*.png"]
